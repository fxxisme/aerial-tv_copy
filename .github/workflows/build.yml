name: Build and Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Guard Debug APK
        run: ./gradlew assembleGuardDebug

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/guard/debug/*.apk release-apks/aerial-guard-debug.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.76-fix-8A002-${{ github.run_number }}
          name: Aerial 1.76 Guard (Fix 8A002 创维修复版 #${{ github.run_number }})
          body: |
            ### 创维 65A3 (8A002_A3) 音量键修复构建
            - 针对 `8A002_A3` 机型关闭无障碍按键过滤（`FLAG_REQUEST_FILTER_KEY_EVENTS`），解决按一次音量键无限连击到极值的问题 (#1058)。
            - **安装提示**：此版本为 Debug 签名，安装前请先在电视上**卸载原有官方版本**。
          files: release-apks/aerial-guard-debug.apk
