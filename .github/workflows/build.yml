name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Guard and Standard Release APKs
        run: ./gradlew assembleGuardRelease assembleStandardRelease --no-daemon

      - name: Upload Guard APK
        uses: actions/upload-artifact@v4
        with:
          name: aerial-guard-skyworth
          path: app/build/outputs/apk/guard/release/*.apk

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: aerial-standard-skyworth
          path: app/build/outputs/apk/standard/release/*.apk
